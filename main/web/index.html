<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<title>Claude Meter</title>
<style>
:root{--bg:#0b0b0a;--card:#161614;--line:#262521;--track:#2c2b27;--text:#faf9f5;--dim:#b0aea5;--faint:#6b6a64;
--accent:#d97757;--ok:#82b56c;--warn:#e9a23b;--high:#e5604e;--r:16px;
font:15px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);padding:max(16px,env(safe-area-inset-top)) 16px 40px}
main{max-width:520px;margin:0 auto;display:grid;gap:14px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 2px}
header h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.spark{width:22px;height:22px;color:var(--accent)}
.pill{margin-left:auto;font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:6px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--high)} .pill.warn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:var(--faint);margin:0 0 12px;text-transform:uppercase}
.hero{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
@media (max-width:380px){.hero{grid-template-columns:1fr;justify-items:center}}
.rings{position:relative;width:150px;height:150px}
.rings svg{transform:rotate(-90deg)}
.rings circle{fill:none;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1),stroke .4s}
.center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.center b{font:700 34px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em}
.center b small{font-size:16px;color:var(--dim);margin-left:1px}
.center span{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);margin-top:6px}
.stats{display:grid;gap:12px}
.stat .k{display:flex;justify-content:space-between;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;color:var(--faint)}
.stat .v{font:700 22px ui-monospace,SFMono-Regular,Menlo,monospace}
.bar{position:relative;height:6px;border-radius:3px;background:var(--track);margin:6px 0 4px;overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar em{position:absolute;top:-3px;width:2px;height:12px;background:var(--text);border-radius:1px;opacity:.85}
.sub{display:flex;justify-content:space-between;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}
#trend{width:100%;height:110px;display:block}
.legend{display:flex;gap:14px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
dt{color:var(--faint)} dd{margin:0;text-align:right;color:var(--dim);overflow-wrap:anywhere}
label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;color:var(--dim)}
label:first-of-type{border-top:0}
input,select,textarea,button{font:inherit;color:var(--text);background:#1f1e1b;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
input[type=range]{padding:0;accent-color:var(--accent);width:150px}
input[type=checkbox]{accent-color:var(--accent);width:20px;height:20px}
select{max-width:200px}
textarea{width:100%;height:84px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
input[type=text],input[type=password]{width:100%}
.row{display:flex;gap:8px;margin-top:10px}
button{background:var(--accent);border-color:var(--accent);color:#1a0f0a;font-weight:600;cursor:pointer;padding:9px 16px}
button.ghost{background:transparent;color:var(--text);border-color:var(--line)}
button:disabled{opacity:.5}
.hint{font-size:12px;color:var(--faint);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);opacity:0;background:var(--text);color:#111;padding:10px 16px;border-radius:12px;font-weight:600;transition:.25s}
.toast.on{transform:translate(-50%,0);opacity:1}
progress{width:100%;accent-color:var(--accent);height:8px;margin-top:10px}
.setup-only{display:none} body.setup .setup-only{display:block} body.setup .sta-only{display:none}
</style>
</head>
<body>
<main>
<header>
  <svg class="spark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.8l1.6 7.1 6.4-3.5-4.2 5.6 6.9 1.7-7 1.3 3.9 6-5.9-4-1.7 7.2-1.6-7.2-6 4 4-6-7-1.3 6.9-1.7L4 5.4l6.4 3.5z"/></svg>
  <h1>Claude Meter</h1>
  <span id="pill" class="pill">…</span>
</header>

<section class="card setup-only">
  <h2>Connect to Wi-Fi</h2>
  <p class="hint" style="margin:0 0 6px">The meter couldn't join a network. Enter your Wi-Fi and it will restart.</p>
</section>

<section class="card hero sta-only">
  <div class="rings">
    <svg width="150" height="150" viewBox="0 0 150 150">
      <circle id="tS" cx="75" cy="75" r="66" stroke-width="11"/>
      <circle id="aS" cx="75" cy="75" r="66" stroke-width="11"/>
      <circle id="tW" cx="75" cy="75" r="50" stroke-width="11"/>
      <circle id="aW" cx="75" cy="75" r="50" stroke-width="11"/>
    </svg>
    <div class="center"><b id="big">--<small>%</small></b><span id="bigsub">session</span></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="k"><span>5-HOUR</span><span id="sPace"></span></div>
      <div class="v" id="sV">--</div><div class="bar"><i id="sB"></i><em id="sM" hidden></em></div>
      <div class="sub"><span id="sR">--</span><span id="sP"></span></div></div>
    <div class="stat"><div class="k"><span>7-DAY</span><span id="wPace"></span></div>
      <div class="v" id="wV">--</div><div class="bar"><i id="wB"></i><em id="wM" hidden></em></div>
      <div class="sub"><span id="wR">--</span><span id="wP"></span></div></div>
  </div>
</section>

<section class="card sta-only">
  <h2>Last 5 hours</h2>
  <svg id="trend" viewBox="0 0 300 110" preserveAspectRatio="none"></svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>session</span><span><i style="background:var(--faint)"></i>weekly</span><span id="proj" style="margin-left:auto"></span></div>
</section>

<section class="card sta-only">
  <h2>Device</h2>
  <dl id="dev"></dl>
  <div class="row"><button class="ghost" id="pollBtn">Refresh now</button><button class="ghost" id="sayBtn">Say status</button><button class="ghost" id="lstBtn">Listen now</button><button class="ghost" id="pageBtn">Next page</button><button class="ghost" id="shotBtn">Screenshot</button></div>
</section>

<section class="card sta-only">
  <h2>Settings</h2>
  <label>Time zone <select id="tz">
    <option value="EST5EDT,M3.2.0,M11.1.0">Eastern</option>
    <option value="CST6CDT,M3.2.0,M11.1.0">Central</option>
    <option value="MST7MDT,M3.2.0,M11.1.0">Mountain</option>
    <option value="MST7">Arizona</option>
    <option value="PST8PDT,M3.2.0,M11.1.0">Pacific</option>
    <option value="GMT0BST,M3.5.0/1,M10.5.0">London</option>
    <option value="CET-1CEST,M3.5.0,M10.5.0/3">Central Europe</option>
    <option value="JST-9">Tokyo</option>
    <option value="UTC0">UTC</option>
  </select></label>
  <label>24-hour clock <input type="checkbox" id="h24"></label>
  <label>Talk (spoken announcements) <input type="checkbox" id="talk"></label>
  <label>Wit (a remark now and then) <input type="checkbox" id="wit"></label>
  <label>“Jarvis” voice control <input type="checkbox" id="listen"></label>
  <label>Listen on battery too <input type="checkbox" id="listen_batt"></label>
  <label>Brain on the Mac (questions → Claude) <input type="checkbox" id="brain"></label>
  <label>Volume <input type="range" id="vol" min="40" max="100" step="5"></label>
  <label>Mute <input type="checkbox" id="mute"></label>
  <label>Quiet hours <span><input type="checkbox" id="quiet"> <select id="qf"></select> – <select id="qt"></select></span></label>
  <label>Brightness on USB <input type="range" id="blu" min="10" max="100" step="5"></label>
  <label>Brightness on battery <input type="range" id="blb" min="5" max="60" step="5"></label>
  <label>Screen off after <select id="blank">
    <option value="60">1 min</option><option value="180">3 min</option><option value="600">10 min</option>
    <option value="1800">30 min</option><option value="0">never</option></select></label>
</section>

<section class="card sta-only">
  <h2>Token</h2>
  <textarea id="tok" placeholder="sk-ant-oat01-…" autocomplete="off" spellcheck="false"></textarea>
  <div class="row"><button id="tokBtn">Save &amp; poll</button></div>
  <p class="hint">Normally pushed automatically by <code>push_claude_token.py</code> on your Mac.</p>
</section>

<section class="card">
  <h2>Wi-Fi</h2>
  <input type="text" id="ssid" placeholder="Network name" autocomplete="off">
  <div style="height:8px"></div>
  <input type="password" id="wpass" placeholder="Password">
  <div class="row"><button id="wifiBtn">Save &amp; restart</button></div>
</section>

<section class="card sta-only">
  <h2>Firmware</h2>
  <input type="file" id="fw" accept=".bin">
  <progress id="fwp" value="0" max="1" hidden></progress>
  <div class="row"><button id="fwBtn">Upload &amp; reboot</button></div>
  <p class="hint" id="fwInfo"></p>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const C={ok:'#82b56c',warn:'#e9a23b',high:'#e5604e',accent:'#d97757',faint:'#6b6a64'};
const lvl=p=>p>=85?C.high:p>=60?C.warn:C.ok;
let S=null,secret=localStorage.getItem('cm-secret')||'',dirty=false;

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function dur(s){if(s<=0)return'now';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return d?`${d}d ${h}h`:h?`${h}h ${String(m).padStart(2,'0')}m`:`${Math.max(m,1)}m`}
function ring(a,t,r,p){const c=2*Math.PI*r;a.style.strokeDasharray=c;a.style.strokeDashoffset=c*(1-Math.min(Math.max(p,0),100)/100);
  a.style.stroke=lvl(p);t.style.stroke=lvl(p)+'33'}
async function api(path,opt={}){opt.headers=Object.assign({},opt.headers,secret?{'X-Auth':secret}:{});
  let r=await fetch(path,opt);
  if(r.status===401){secret=prompt('Device secret (X-Auth)')||'';localStorage.setItem('cm-secret',secret);
    opt.headers['X-Auth']=secret;r=await fetch(path,opt)}
  if(!r.ok)throw new Error(await r.text()||r.status);return r}

function pace(p,reset,win,now){if(!reset||now<1.6e9)return null;const left=Math.min(Math.max(reset-now,0),win);
  const e=(win-left)/win*100;return {e,d:Math.round(p-e)}}

function stat(k,p,reset,win,now){
  $(k+'V').textContent=p+'%';$(k+'V').style.color=lvl(p);
  $(k+'B').style.width=Math.min(p,100)+'%';$(k+'B').style.background=lvl(p);
  $(k+'R').textContent=reset&&now>1.6e9?'resets in '+dur(reset-now):'';
  const pc=pace(p,reset,win,now),m=$(k+'M'),t=$(k+'P');
  if(pc){m.hidden=false;m.style.left=`calc(${pc.e}% - 1px)`;
    t.textContent=pc.d>10?`+${pc.d} ahead of pace`:pc.d<-10?`${-pc.d} under pace`:'on pace';
    t.style.color=pc.d>25?C.high:pc.d>10?C.warn:pc.d<-10?'':C.ok}else{m.hidden=true;t.textContent=''}
}

function trend(u,now){
  const sv=$('trend'),W=300,H=110,n=61,pts=k=>{const a=u[k].slice();if(u.have)a.push(k==='hs'?Math.min(u.s,100):Math.min(u.w,100));
    const off=n-a.length;return a.map((v,i)=>[(off+i)/(n-1)*W,H-4-v/100*(H-8)])};
  const line=p=>p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  let g='';for(let i=0;i<=4;i++){const y=4+i*(H-8)/4;g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#262521"/>`}
  const s=pts('hs'),w=pts('hw');
  if(s.length>=2){g+=`<defs><linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.accent}" stop-opacity=".45"/><stop offset="1" stop-color="${C.accent}" stop-opacity="0"/></linearGradient></defs>`+
    `<path d="${line(w)}" fill="none" stroke="${C.faint}" stroke-width="2" vector-effect="non-scaling-stroke"/>`+
    `<path d="${line(s)} L${s[s.length-1][0]} ${H} L${s[0][0]} ${H}Z" fill="url(#gS)"/>`+
    `<path d="${line(s)}" fill="none" stroke="${C.accent}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`}
  else g+=`<text x="150" y="60" fill="#6b6a64" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo">collecting…</text>`;
  sv.innerHTML=g;
  const pc=pace(u.s,u.sr,18000,now);let pj='';
  if(pc&&pc.e>=10&&u.s>0){const el=pc.e/100*18000,toFull=(100-u.s)*el/u.s,left=18000-el;
    pj=u.s<100&&toFull<left?`limit ~${new Date((now+toFull)*1000).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`:`projected ${Math.round(u.s*18000/el)}%`}
  $('proj').textContent=pj;
}

function render(){
  const u=S.usage,d=S.dev,now=S.now;
  document.body.classList.toggle('setup',S.mode==='setup');
  const p=$('pill');
  if(S.mode==='setup'){p.textContent='setup';p.className='pill warn'}
  else if(u.ok){p.textContent=u.age>=0?`live · ${u.age<60?u.age+'s':dur(u.age)}`:'live';p.className='pill ok'}
  else if(!u.have&&!u.err){p.textContent='loading';p.className='pill'}
  else{p.textContent=u.err||'error';p.className='pill bad'}
  ring($('aS'),$('tS'),66,u.s);ring($('aW'),$('tW'),50,u.w);
  $('big').innerHTML=(u.have?u.s:'--')+'<small>%</small>';
  $('bigsub').textContent=u.have&&u.sr&&now>1.6e9?'resets '+dur(u.sr-now):'session';
  stat('s',u.s,u.sr,18000,now);stat('w',u.w,u.wr,604800,now);
  trend(u,now);
  const rows=[['Wi-Fi',d.ssid?`${d.ssid} · ${d.rssi} dBm`:'—'],['IP',d.ip||'—'],
    ['Battery',d.batt<0?'—':`${d.batt}%${d.ext?' · charging':''}`],['Source',u.src],
    ['Token',u.token?'stored':'missing'],['Token host',d.notify],
    ['Jarvis',S.listen?`${S.listen.state}${S.listen.heard?' · last: “'+S.listen.heard+'”':''} · brain ${S.listen.brain} · mic ${S.listen.level_db} dB`:'—'],['Voice',S.voice.clips?`${S.voice.name} · ${S.voice.clips} clips`:'none (tones)'],['Uptime',dur(S.up)],['Heap',`${(d.heap/1024).toFixed(0)} KB free · min ${(d.heap_min/1024).toFixed(0)} KB`],['Firmware',`${S.fw} · ${S.slot} · ${S.ota}`]];
  $('dev').innerHTML=rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('');
  $('fwInfo').textContent=`Running ${S.fw} on ${S.slot}. Uploads go to the other slot and roll back automatically if they fail to come online.`;
  if(!dirty){const s=S.set;$('tz').value=s.tz;if($('tz').value!==s.tz){const o=new Option(s.tz,s.tz);$('tz').add(o);$('tz').value=s.tz}
    $('h24').checked=s.h24;$('talk').checked=s.talk;$('wit').checked=s.wit;$('listen').checked=s.listen;$('listen_batt').checked=s.listen_batt;$('brain').checked=s.brain;$('vol').value=s.vol;$('mute').checked=s.mute;$('quiet').checked=s.quiet;
    $('qf').value=s.qf;$('qt').value=s.qt;$('blu').value=s.blu;$('blb').value=s.blb;$('blank').value=s.blank;
    if(!$('ssid').value&&d.ssid)$('ssid').placeholder=d.ssid}
}

async function refresh(){try{S=await (await fetch('/api/status',{cache:'no-store'})).json();render()}catch(e){$('pill').textContent='unreachable';$('pill').className='pill bad'}}

for(const id of ['qf','qt'])for(let h=0;h<24;h++)$(id).add(new Option(String(h).padStart(2,'0')+':00',h));
let saveT;
function saveSettings(extra={}){dirty=true;clearTimeout(saveT);saveT=setTimeout(async()=>{
  const b={tz:$('tz').value,h24:$('h24').checked,talk:$('talk').checked,wit:$('wit').checked,listen:$('listen').checked,listen_batt:$('listen_batt').checked,brain:$('brain').checked,vol:+$('vol').value,mute:$('mute').checked,quiet:$('quiet').checked,
    qf:+$('qf').value,qt:+$('qt').value,blu:+$('blu').value,blb:+$('blb').value,blank:+$('blank').value,...extra};
  try{await api('/api/settings',{method:'POST',body:JSON.stringify(b)});toast('Saved')}catch(e){toast('Save failed: '+e.message)}
  dirty=false},350)}
for(const id of ['tz','h24','talk','wit','listen','listen_batt','brain','mute','quiet','qf','qt','blu','blb','blank'])$(id).addEventListener('change',()=>saveSettings());
$('vol').addEventListener('change',()=>saveSettings({test:true}));

$('tokBtn').onclick=async()=>{const t=$('tok').value.trim();if(t.length<20)return toast('That token looks too short');
  try{await api('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'token='+encodeURIComponent(t)});
    $('tok').value='';toast('Token saved — polling');setTimeout(refresh,2500)}catch(e){toast('Failed: '+e.message)}};
$('wifiBtn').onclick=async()=>{const ss=$('ssid').value.trim();if(!ss)return toast('Enter a network name');
  try{await api('/api/wifi',{method:'POST',body:JSON.stringify({ssid:ss,pass:$('wpass').value})});toast('Saved — restarting')}catch(e){toast('Failed: '+e.message)}};
$('pollBtn').onclick=async()=>{try{await api('/api/poll',{method:'POST'});toast('Polling…');setTimeout(refresh,3000)}catch(e){toast(e.message)}};
$('sayBtn').onclick=async()=>{try{await api('/api/say',{method:'POST',body:'{"status":true}'})}catch(e){toast(e.message)}};
$('lstBtn').onclick=async()=>{try{await api('/api/say',{method:'POST',body:'{"listen":true}'});toast('Listening — say a command')}catch(e){toast(e.message)}};
$('pageBtn').onclick=async()=>{try{await api('/api/button',{method:'POST',body:'{}'})}catch(e){toast(e.message)}};
$('shotBtn').onclick=()=>window.open('/api/screen.bmp?'+Date.now(),'_blank');
$('fwBtn').onclick=()=>{const f=$('fw').files[0];if(!f)return toast('Choose a .bin first');
  const x=new XMLHttpRequest(),pg=$('fwp');pg.hidden=false;$('fwBtn').disabled=true;
  x.upload.onprogress=e=>{if(e.lengthComputable)pg.value=e.loaded/e.total};
  x.onload=()=>{$('fwBtn').disabled=false;toast(x.status===200?'Uploaded — rebooting':'Upload failed: '+x.responseText);if(x.status===200)setTimeout(refresh,12000)};
  x.onerror=()=>{$('fwBtn').disabled=false;toast('Upload failed')};
  x.open('POST','/ota');if(secret)x.setRequestHeader('X-Auth',secret);x.send(f)};

refresh();setInterval(refresh,5000);
</script>
</body>
</html>
